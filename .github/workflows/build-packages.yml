name: Build Packages (All Platforms)

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Debian / Ubuntu (.deb) ──────────────────────────────────────────────
  build-deb:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake extra-cmake-modules libfcitx5core-dev \
            fcitx5 pkg-config gettext dpkg-dev apt-utils librsvg2-bin libdbus-1-dev \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev qt6-base-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build .deb package
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: '*.deb'

  # ── PPA source package + upload to Launchpad ──────────────────────────
  build-ppa-source:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper dpkg-dev git rsync dput

      - name: Extract version
        run: |
          VER=$(grep -oP 'project\(fcitx5-skey VERSION \K[0-9.]+' CMakeLists.txt)
          echo "PKG_VERSION=$VER" >> $GITHUB_ENV

      - name: Import GPG key
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
        run: |
          echo "$PPA_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          echo "=== GPG keys imported ==="
          gpg --list-secret-keys --keyid-format LONG

      - name: Create orig tarball
        run: |
          chmod +x scripts/make-ppa-source.sh
          ./scripts/make-ppa-source.sh "$PKG_VERSION"

      - name: Build source package
        run: |
          set -o pipefail
          debuild -S -sa -d 2>&1 | tee /tmp/debuild.log
          echo "=== debuild exit code: $? ==="
          echo "=== Files in parent ==="
          ls -la ../*.dsc ../*.orig.tar.* ../*.debian.tar.* ../*_source.* 2>/dev/null || echo "(none found)"
          # debuild places output in parent dir — copy back for artifact upload
          cp ../*.dsc ../*.orig.tar.* ../*.debian.tar.* ../*_source.* . 2>/dev/null || true
          echo "=== Source package files ==="
          ls -la *.dsc *.orig.tar.* *.debian.tar.* *_source.* 2>/dev/null || true

      - name: Import GPG key (for signing)
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
        run: |
          echo "$PPA_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          for fp in $(gpg --list-secret-keys --with-colons | grep '^fpr:' | cut -d: -f10); do
            echo "$fp:6:" | gpg --batch --import-ownertrust
          done

      - name: Upload PPA source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppa-source
          path: |
            *.dsc
            *.orig.tar.*
            *.debian.tar.*
            *_source.changes
            *_source.buildinfo

  # ── Fedora / openSUSE (.rpm) ────────────────────────────────────────────
  build-rpm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: fedora
            image: quay.io/fedora/fedora:42
            pre_install: dnf install -y tar git
            install: |
              dnf install -y cmake extra-cmake-modules fcitx5-devel fcitx5 \
                dbus-devel gettext gcc-c++ make \
                qt6-qtbase-devel librsvg2-tools \
                rpm-build rpm-sign gpg createrepo_c
          - distro: opensuse
            image: opensuse/tumbleweed
            pre_install: |
              zypper --non-interactive install --force-resolution tar git gawk
            install: |
              zypper --non-interactive install --force-resolution \
                cmake extra-cmake-modules \
                fcitx5-devel fcitx5 dbus-1-devel gettext gcc-c++ make \
                qt6-base-devel rsvg-convert \
                rpm-build gpg2 createrepo_c

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install prerequisites (tar, git)
        run: ${{ matrix.pre_install }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: ${{ matrix.install }}

      - name: Import GPG key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Extract version
        run: |
          VER=$(grep -oP 'project\(fcitx5-skey VERSION \K[0-9.]+' CMakeLists.txt)
          echo "PKG_VERSION=$VER" >> $GITHUB_ENV

      - name: Prepare source tarball and spec
        run: |
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          tar czf ~/rpmbuild/SOURCES/fcitx5-skey-${{ env.PKG_VERSION }}.tar.gz \
            --exclude='.git' --exclude='build' --exclude='build-deb' \
            --transform "s,^.,fcitx5-skey-${{ env.PKG_VERSION }}," .
          sed "s/^Version:.*/Version:        ${{ env.PKG_VERSION }}/" \
            packaging/fcitx5-skey.spec > ~/rpmbuild/SPECS/fcitx5-skey.spec

      - name: Install Rust and build RPM
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          export PATH="$HOME/.cargo/bin:$PATH"
          rpmbuild -bb --nocheck --define "_topdir $HOME/rpmbuild" \
            ~/rpmbuild/SPECS/fcitx5-skey.spec

      - name: Sign RPMs
        env:
          APT_GPG_KEY_EMAIL: ${{ secrets.APT_GPG_KEY_EMAIL }}
        run: |
          echo "%_signature gpg" > ~/.rpmmacros
          echo "%_gpg_name ${APT_GPG_KEY_EMAIL}" >> ~/.rpmmacros
          for rpm in $(find ~/rpmbuild/RPMS -name '*.rpm' -not -name '*.src.rpm'); do
            echo "Signing: $rpm"
            rpmsign --addsign "$rpm"
          done

      - name: Find and copy RPMs
        run: |
          # Copy ALL RPMs (main + debuginfo), not just the first one
          find ~/rpmbuild/RPMS -name '*.rpm' -not -name '*.src.rpm' -exec cp {} ./ \;
          # Verify the main package exists
          ls -la ./*.rpm
          # Set RPM_FILE to the main package (not debuginfo) for reference
          MAIN_RPM=$(find . -maxdepth 1 -name 'fcitx5-skey-[0-9]*.rpm' -not -name '*debug*' | head -1)
          echo "RPM_FILE=$(basename "$MAIN_RPM")" >> $GITHUB_ENV

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distro }}
          path: '*.rpm'

  # ── Arch Linux (.pkg.tar.zst) ───────────────────────────────────────────
  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged  # needed for makepkg fakeroot

    steps:
      - name: Install prerequisites (tar, git)
        run: |
          pacman-key --init 2>/dev/null || :
          pacman -Syu --noconfirm tar git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm base-devel sudo cmake extra-cmake-modules \
            fcitx5 gettext dbus rust qt6-base

      - name: Create builder user (makepkg refuses root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Import GPG key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          sudo -u builder gpg --batch --import <<< "$APT_GPG_PRIVATE_KEY"

      - name: Extract version and prepare src
        run: |
          VER=$(grep -oP 'project\(fcitx5-skey VERSION \K[0-9.]+' CMakeLists.txt)
          echo "PKG_VERSION=$VER" >> $GITHUB_ENV
          cp packaging/PKGBUILD ./PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$VER/" PKGBUILD
          mkdir -p /tmp/pkgsrc/fcitx5-skey-$VER
          cp -a . /tmp/pkgsrc/fcitx5-skey-$VER/
          mv /tmp/pkgsrc/fcitx5-skey-$VER src/

      - name: Build Arch package
        env:
          APT_GPG_KEY_EMAIL: ${{ secrets.APT_GPG_KEY_EMAIL }}
        run: |
          chown -R builder:builder .
          sudo -u builder bash -c '
            export GPGKEY="$APT_GPG_KEY_EMAIL"
            makepkg -f -e --sign --noconfirm
          '

      - name: Generate repo database
        env:
          APT_GPG_KEY_EMAIL: ${{ secrets.APT_GPG_KEY_EMAIL }}
        run: |
          sudo -u builder bash -c "export GPGKEY='$APT_GPG_KEY_EMAIL' && repo-add -s -R fcitx5-skey.db.tar.gz ./*.pkg.tar.zst"

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            *.pkg.tar.zst
            *.pkg.tar.zst.sig
            *.db*
            *.files*

  # ── GitHub Release (all artifacts, tag only) ───────────────────────────
  release:
    needs: [build-deb, build-rpm, build-arch, build-ppa-source]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fcitx5-skey_*.deb
            *.rpm
            *.pkg.tar.zst
            *.pkg.tar.zst.sig
            *.dsc
            *.orig.tar.*
            *.debian.tar.*
            *_source.changes
            *_source.buildinfo
          draft: false
          prerelease: false

  # ── Publish all repos to gh-pages (single job, no race) ──────────────────
  publish:
    needs: [build-deb, build-rpm, build-arch]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Install publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c git

      - name: Import GPG key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Publish all repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_GPG_KEY_EMAIL: ${{ secrets.APT_GPG_KEY_EMAIL }}
        run: |
          bash scripts/publish-all.sh
