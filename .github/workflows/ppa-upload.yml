name: PPA Upload (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (leave blank to use version from CMakeLists.txt)'
        required: false
        default: ''
      series:
        description: 'Series list (space-separated; leave blank for noble resolute)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  ppa-upload:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          # Azure mirror on GitHub-hosted runners frequently hangs; replace with main archive.
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper dpkg-dev git rsync dput

      - name: Resolve version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER=$(grep -oP 'project\(fcitx5-skey VERSION \K[0-9.]+' CMakeLists.txt)
          fi
          if [ -z "$VER" ]; then
            echo "Error: could not resolve package version from CMakeLists.txt" >&2
            exit 1
          fi
          echo "PKG_VERSION=$VER" >> $GITHUB_ENV
          echo "Resolved package version: $VER"
          # Pin artifact timestamps to the HEAD commit so re-uploading the same
          # version produces bit-identical files (Launchpad rejects same-name
          # files with different contents, even after deleting the package).
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Import GPG key
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
        run: |
          echo "$PPA_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          for fp in $(gpg --list-secret-keys --with-colons | grep '^fpr:' | cut -d: -f10); do
            echo "$fp:6:" | gpg --batch --import-ownertrust
          done
          echo "=== GPG keys imported ==="
          gpg --list-secret-keys --keyid-format LONG

      - name: Build & upload for all series
        env:
          SERIES_INPUT: ${{ github.event.inputs.series }}
        run: |
          chmod +x scripts/make-ppa-source.sh scripts/ppa-build-upload.sh
          # Empty SERIES_INPUT → script falls back to "noble resolute"
          ./scripts/ppa-build-upload.sh "$PKG_VERSION" "$SERIES_INPUT"
